[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deeper"
version = "0.0.0"
description = "Gated multi-agent research pipeline (pipeline-as-kernel, UI-as-viewer)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyle Wilson" }]
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2",
    "pyyaml",
    "typer",
    "rich",
    "pytest",
    "pytest-asyncio",
    # Viewer (design §8 v2): server-rendered pages over the workspace.
    "fastapi",
    "jinja2",
    "uvicorn",
    "markdown",
    "httpx",
]

[project.scripts]
deeper = "deeper.orchestrator.cli:app"
deeper-lab = "deeper.promptlab:app"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# Lenient by design: types are advisory scaffolding, not a gate, at this stage.
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = false
