# Mock S0 brief — the design doc's senior-project running example.
# The interview's "it must be a machine learning project" statement was challenged
# (program rules do not require ML) and classified as a STRONG PREFERENCE — it lives
# in preferences.yaml, deliberately absent from these constraints.
goal: Choose the senior research project that best positions me for admission to a
  top ML PhD program
answer_type: decision
scope_in:
  - projects feasible within two semesters
  - projects with a faculty supervisor at my university
scope_out:
  - industry internships
  - coursework-only options
constraints:
  - statement: Thesis must be submitted by April 2027
    kind: deadline
  - statement: Compute limited to the lab's shared 4x A100 node
    kind: budget
notes: null
