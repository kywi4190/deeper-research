thin_areas:
  - Theory-only projects (no experiments) were never proposed by any heuristic — a
    real region for a student with the right mathematical background.
  - No heuristic varied the human-subjects dimension (HCI, qualitative studies of
    model use); likely a blind spot of an ML-centric ensemble.
strategic_notes:
  - insight: Pick the project whose supervisor writes the strongest specific letters,
      even over a marginally better topic.
    kind: rubric-weight
    rationale: The destination model lists letters as a first-class reward; letter
      strength varies more across supervisors than topic quality varies across these
      angles.
    source_heuristics: [analogist, practitioner]
  - insight: Structure the two semesters as workshop paper first, then main-venue
      extension, and submit something peer-reviewed before the December application
      deadline.
    kind: execution
    rationale: An under-review first-author paper changes how committees read the file;
      the April 2027 thesis deadline is not the binding one, and workshop-first cadence
      de-risks it.
    source_heuristics: [practitioner]
  - insight: Frame the thesis around a question, not a method.
    kind: reframe
    rationale: Question-driven narratives differentiate applications more than topic
      choice; the brief's "which project" framing may under-weight this.
    source_heuristics: [contrarian]
notes: null
