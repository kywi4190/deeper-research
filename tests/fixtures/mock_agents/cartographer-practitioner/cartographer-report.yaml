# Mock S1 raw report — practitioner: what do current PhD students say worked?
# One novel region (supervisor pipelines); the rest corroborates earlier heuristics.
heuristic: practitioner
angles:
  - name: Supervisor-pipeline projects
    definition: Join an existing faculty research agenda where infrastructure, data,
      and a publication pipeline already exist.
    distinctness_rationale: Selects on execution certainty and letter strength rather
      than topic novelty — a different optimization axis than any topic angle.
    example_options:
      - Extend the supervisor's current NeurIPS submission with a follow-up study
      - Take ownership of an existing lab codebase's open research question
    relevance_rationale: Practitioners consistently report that letters from close
      collaboration outweigh solo novelty; publication odds are highest inside a
      working pipeline.
    notes: null
  - name: Open-source research tooling
    definition: Build and maintain a research tool the community adopts, with a
      systems-track paper describing it.
    distinctness_rationale: Impact is measured in adoption and citations-from-use,
      not benchmark deltas — a distinct judge within ML venues.
    example_options:
      - An activation-caching library for interpretability workflows
      - A reproducible-eval harness adopted by other labs
    relevance_rationale: Visible artifacts with real users give recommenders concrete
      material; feasible on lab compute since users bring their own.
    notes: null
  - name: Industry-partner applied projects
    definition: Deliver an ML solution against a company's or external lab's concrete
      data problem, co-supervised by the partner.
    distinctness_rationale: The partner's operational judgment is a second judge, and
      data access replaces compute as the scarce resource.
    example_options:
      - Clinical-notes information extraction with a med-school lab
      - Demand-forecasting study with a local industry partner
    relevance_rationale: Practitioners report applied co-supervised theses produce
      strong letters and defensible papers, though partner timelines are risky
      against the December application deadline.
    notes: null
strategic_notes:
  - insight: Whatever project is chosen, structure the two semesters as workshop paper
      first, then main-venue extension — and submit something peer-reviewed before the
      December application deadline.
    kind: execution
    rationale: Practitioners report an under-review first-author paper changes how
      committees read the whole file; the thesis deadline (April 2027) is not the
      binding deadline, and workshop-first cadence de-risks it.
    source_heuristics: []
  - insight: Pick the project whose supervisor writes the strongest specific letters,
      even over a marginally better topic.
    kind: rubric-weight
    rationale: Current students consistently attribute admits to close-collaboration
      letters; letter strength varies more across supervisors than topic quality
      varies across these angles.
    source_heuristics: []
notes: null
