    misplaced_flag: null
    notes: null
  - id: repro-eval-harness
    name: Reproducible-eval harness adopted by other labs
    angle_id: research-tooling
    description: A pinned-environment evaluation harness that makes eval runs
      bit-reproducible across machines, aimed at labs burned by eval drift.
    mechanism: Deterministic seeding, pinned tokenizers, and environment capture
      remove the variance that makes published eval numbers unreproducible.
    preliminary_evidence:
      - text: Eval-reproducibility failures are documented across published model
          comparisons, evidencing the need.
        source:
          url: "https://arxiv.org/abs/2405.14782"
          tier: T2
          title: Lessons from the Trenches on Reproducible Evaluation
          content_hash: null
    uncertainties:
