cards:
  - id: activation-caching-lib
    name: Activation-caching library for interpretability workflows
    angle_id: research-tooling
    description: Build and maintain a content-addressed activation-caching library
      that removes redundant forward passes from interpretability experiments,
      with a systems-track paper describing it.
    mechanism: Content-addressed caching of intermediate activations makes repeated
      probing/patching experiments near-free; adoption is the validity metric.
    preliminary_evidence:
      - text: Interpretability workflows visibly recompute activations today, and
          systems tracks publish adopted research infrastructure.
        source:
          url: "https://github.com/TransformerLensOrg/TransformerLens/issues"
          tier: T3
          title: Recomputation pain points in tooling issue trackers
          content_hash: null
    uncertainties:
      - Whether adoption arrives fast enough to evidence the paper by the deadline
      - Storage economics on shared lab infrastructure
